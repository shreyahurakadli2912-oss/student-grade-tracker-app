# ===================================================================
# Render Blueprint Specification for Student Grade Tracker
# Deployable as a single service with optional managed PostgreSQL
# ===================================================================
services:
  - type: web
    name: student-grade-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: student-grade-db
          property: connectionString

databases:
  - name: student-grade-db
    databaseName: studentgradedb
    user: studentgrade_admin
    plan: free
    region: oregon
