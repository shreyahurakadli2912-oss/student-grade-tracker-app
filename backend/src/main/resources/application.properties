# ===================================================================
# Student Grade Management System - Application Configuration
# Production Single-Origin & Resilient Cloud/Local Configuration
# ===================================================================

# Server Port (Reads $PORT assigned by cloud platforms like Render, defaults to 8080)
server.port=${PORT:8080}
server.shutdown=graceful
spring.application.name=StudentGradeTracker

# Production Safe Error Handling (No stacktrace leakage)
server.error.include-stacktrace=never
server.error.include-message=always

# Datasource Configuration
# Defaults to file-based persistent H2; seamlessly overridable via SPRING_DATASOURCE_URL or DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/studentgradedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate (Automatic dialect detection, non-destructive schema update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Static Resources (Serves compiled React frontend from classpath:/static/)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.cache=true

# Spring Boot Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# H2 Web Console (Available when using H2 database engine)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart File Upload (Bulk CSV / Excel)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Production Logging
logging.level.com.studentgradetracker=INFO
logging.level.org.springframework.web=INFO
